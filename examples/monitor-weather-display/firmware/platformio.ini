; Monitor weather display: firmware for the ESP32-C3 SuperMini + GC9A01 round display.
; Pins come from ../pinmap.json: tools/gen_pins.py writes include/pins.h before every build (never edit pins.h by hand).
; Flashing a real board is gate G4: build freely, upload only when the user says so.
;   build:   pio run            (from this folder; pio lives in %USERPROFILE%\.local\bin)
;   upload:  pio run -t upload  (gate G4)
[env:c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/gen_pins.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1
